<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Household Debt Predictor</title>
    <style>
        :root {
            --primary: #6c5ce7;
            --secondary: #a29bfe;
            --bg: #0f0c29;
            --glass: rgba(255, 255, 255, 0.1);
            --text: #ffffff;
        }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: linear-gradient(to right, #24243e, #302b63, #0f0c29);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            background: var(--glass);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 100%;
            max-width: 500px;
            animation: fadeIn 1s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(to right, #fff, var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9em;
            color: var(--secondary);
            font-weight: 600;
        }
        input[type="number"] {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: #fff;
            font-size: 1em;
            outline: none;
            transition: border 0.3s;
            box-sizing: border-box;
        }
        input:focus {
            border-color: var(--primary);
        }
        .switch-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #444;
            transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 26px; width: 26px;
            left: 4px; bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(26px); }

        .result-panel {
            margin-top: 40px;
            text-align: center;
            padding: 25px;
            background: linear-gradient(135deg, rgba(108, 92, 231, 0.2), rgba(162, 155, 254, 0.1));
            border-radius: 20px;
            border: 1px solid rgba(108, 92, 231, 0.3);
        }
        .result-label {
            font-size: 0.8em;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--secondary);
            margin-bottom: 10px;
        }
        .result-value {
            font-size: 2.5em;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 0 20px rgba(108, 92, 231, 0.5);
        }
        .unit { font-size: 0.4em; margin-left: 5px; color: var(--secondary); }
    </style>
</head>
<body>

    <div class="container">
        <h1>Debt Predictor</h1>
        
        <div class="input-group">
            <label>Monthly Income (rshhinc11)</label>
            <input type="number" id="income" value="25000" oninput="calculate()">
        </div>

        <div class="input-group">
            <label>Housing/Land Value (val_houseland)</label>
            <input type="number" id="assets" value="500000" oninput="calculate()">
        </div>

        <div class="input-group">
            <label>Age of Household Head</label>
            <input type="number" id="age" value="45" oninput="calculate()">
        </div>

        <div class="switch-group">
            <label>Agriculture Sector?</label>
            <label class="switch">
                <input type="checkbox" id="agsector" onchange="calculate()">
                <span class="slider"></span>
            </label>
        </div>

        <div class="result-panel">
            <div class="result-label">Predicted Total Debt</div>
            <div class="result-value" id="result">0<span class="unit">Units</span></div>
        </div>
    </div>

    <script>
        function calculate() {
            // OLS Coefficients from our model
            const intercept = 121700;
            const b_income = 4.5087;
            const b_assets = 0.0286;
            const b_age = -1614.8055;
            const b_agsector = -24390;

            // Get values
            const income = parseFloat(document.getElementById('income').value) || 0;
            const assets = parseFloat(document.getElementById('assets').value) || 0;
            const age = parseFloat(document.getElementById('age').value) || 0;
            const isAg = document.getElementById('agsector').checked;

            // Calculate
            let prediction = intercept + 
                             (income * b_income) + 
                             (assets * b_assets) + 
                             (age * b_age);
            
            if (isAg) {
                prediction += b_agsector;
            }

            // Display (Format as currency)
            const resultElement = document.getElementById('result');
            resultElement.innerHTML = Math.max(0, prediction).toLocaleString(undefined, {maximumFractionDigits: 0}) + '<span class="unit">Units</span>';
        }

        // Initial calc
        calculate();
    </script>
</body>
</html>
